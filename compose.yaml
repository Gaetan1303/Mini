services:
  web:
    image: php:8.2-apache
    container_name: mini_upload_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
    restart: unless-stopped
    command: sh -c "chown -R www-data:www-data /var/www/html/uploads && docker-php-entrypoint apache2-foreground"
